<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VoiceStudio</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#fafafa;color:#111;max-width:640px;margin:auto}
h1{font-size:22px;text-align:center}
textarea,select,input{width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;margin:4px 0 10px;background:#fff}
textarea{min-height:150px}
button{padding:10px 16px;border:0;border-radius:8px;background:#111;color:#fff;font-size:15px;margin:3px 2px}
button.s{background:#e5e5e5;color:#111}
.tabs button{background:#e5e5e5;color:#111}.tabs button.on{background:#5b5bf0;color:#fff}
label{font-size:13px;color:#555}
#st{font-size:13px;margin-top:8px;min-height:20px}
.err{color:#c00}.ok{color:#080}
.hide{display:none}
</style></head><body>
<h1>VoiceStudio</h1>
<div class="tabs"><button id="t1" class="on">Browser voices (free)</button><button id="t2">ElevenLabs (your key)</button></div>
<textarea id="txt" placeholder="Type or paste your script...">[Opening]
Good morning, my dear friends. Let us begin this day in prayer.
[pause 1s]
Heavenly Father, thank You for a new morning. Amen.</textarea>
<label><input type="checkbox" id="clean" checked style="width:auto;margin:0 6px 0 0">Remove [labels] and (scene notes) before speaking</label>

<div id="p1">
<label>Language (full name)</label><select id="lang"></select>
<label>Voice</label><select id="voice"></select>
<label>Speed <span id="sv">1.0</span></label><input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
<label>Pitch <span id="pv">1.0</span></label><input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
<button id="gen">Generate</button><button class="s" id="test">Test voice</button>
<button class="s" id="pause">Pause</button><button class="s" id="stop">Stop</button>
</div>

<div id="p2" class="hide">
<label>ElevenLabs API key</label><input id="key" type="password" placeholder="xi-api-key">
<button class="s" id="load">Load my voices</button>
<label>Voice</label><select id="evoice"></select>
<button id="egen">Generate audio</button>
<audio id="aud" controls style="width:100%;margin-top:10px"></audio>
<a id="dl" download="voice.mp3" class="hide">Download MP3</a>
</div>
<div id="st"></div>

<script>
const $=id=>document.getElementById(id);
const st=(m,c)=>{$('st').textContent=m;$('st').className=c||''};
const syn=window.speechSynthesis;
let voices=[];
function dn(code){
  try{
    const [l,r]=code.replace('_','-').split('-');
    const L=new Intl.DisplayNames(['en'],{type:'language'}).of(l);
    const R=r?new Intl.DisplayNames(['en'],{type:'region'}).of(r.toUpperCase()):'';
    return R?`${L} (${R})`:L;
  }catch(e){return code}
}
function loadVoices(){
  voices=syn?syn.getVoices():[];
  const sel=$('lang');const prev=sel.value;
  const codes=[...new Set(voices.map(v=>v.lang.replace('_','-')))].sort((a,b)=>dn(a).localeCompare(dn(b)));
  sel.innerHTML='<option value="all">All languages</option>'+codes.map(c=>`<option value="${c}">${dn(c)}</option>`).join('');
  if(prev&&codes.includes(prev))sel.value=prev;
  else{const en=codes.find(c=>c==='en-US');if(en)sel.value=en;}
  fillVoices();
  if(!voices.length)st('Is device par koi voice nahi mili. Phone Settings > Accessibility > Text-to-speech output > Google Speech Services chunein, awaaz download karein, phir page refresh karein.','err');
  else st(voices.length+' voices found on this device.','ok');
}
function fillVoices(){
  const l=$('lang').value;
  const list=voices.filter(v=>l==='all'||v.lang.replace('_','-')===l);
  $('voice').innerHTML=list.map(v=>`<option value="${v.voiceURI}">${v.name} — ${dn(v.lang)}</option>`).join('');
}
if(syn){syn.onvoiceschanged=loadVoices;loadVoices();setTimeout(loadVoices,800);setTimeout(loadVoices,2500);}
else st('Is browser mein speech support nahi. Chrome use karein.','err');
$('lang').onchange=fillVoices;
$('rate').oninput=e=>$('sv').textContent=(+e.target.value).toFixed(1);
$('pitch').oninput=e=>$('pv').textContent=(+e.target.value).toFixed(1);

function getText(){
  let t=$('txt').value;
  if($('clean').checked)t=t.replace(/\[[^\]]*\]/g,' ').replace(/\([^)]*\)/g,' ');
  return t.replace(/\s+/g,' ').trim();
}
function chunks(t){return (t.match(/[^.!?۔؟\n]+[.!?۔؟]?/g)||[t]).map(s=>s.trim()).filter(Boolean)}
function speak(text){
  if(!syn)return;
  if(!text){st('Pehle text likhein.','err');return}
  syn.cancel();
  const v=voices.find(x=>x.voiceURI===$('voice').value);
  const parts=chunks(text);let i=0,started=false;
  const next=()=>{
    if(i>=parts.length){st('Done.','ok');return}
    const u=new SpeechSynthesisUtterance(parts[i++]);
    if(v){u.voice=v;u.lang=v.lang.replace('_','-')}
    u.rate=+$('rate').value;u.pitch=+$('pitch').value;u.volume=1;
    u.onstart=()=>{started=true;st('Speaking... ('+i+'/'+parts.length+')','ok')};
    u.onend=next;
    u.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')st('Error: '+e.error+'. Doosri voice chunein ya media volume check karein.','err')};
    syn.speak(u);
  };
  next();
  setTimeout(()=>{if(!started&&!syn.speaking)st('Awaaz start nahi hui. Media volume upar karein, doosri voice chunein, ya Google Speech Services install karein.','err')},2500);
}
$('gen').onclick=()=>speak(getText());
$('test').onclick=()=>speak('Hello. This is a test of the selected voice.');
$('pause').onclick=()=>syn.pause();
$('stop').onclick=()=>{syn.cancel();st('Stopped.')};

$('t1').onclick=()=>{$('p1').className='';$('p2').className='hide';$('t1').className='on';$('t2').className=''};
$('t2').onclick=()=>{$('p2').className='';$('p1').className='hide';$('t2').className='on';$('t1').className=''};
$('load').onclick=async()=>{
  try{
    const r=await fetch('https://api.elevenlabs.io/v1/voices',{headers:{'xi-api-key':$('key').value.trim()}});
    if(!r.ok)throw new Error('Key galat hai ya limit khatam ('+r.status+')');
    const d=await r.json();
    $('evoice').innerHTML=d.voices.map(v=>`<option value="${v.voice_id}">${v.name}</option>`).join('');
    st(d.voices.length+' ElevenLabs voices loaded.','ok');
  }catch(e){st(e.message,'err')}
};
$('egen').onclick=async()=>{
  try{
    st('Generating...');
    const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+$('evoice').value,{
      method:'POST',headers:{'xi-api-key':$('key').value.trim(),'Content-Type':'application/json'},
      body:JSON.stringify({text:getText(),model_id:'eleven_multilingual_v2'})});
    if(!r.ok)throw new Error('ElevenLabs error '+r.status);
    const url=URL.createObjectURL(await r.blob());
    $('aud').src=url;$('aud').play();$('dl').href=url;$('dl').className='';
    st('Done.','ok');
  }catch(e){st(e.message,'err')}
};
</script></body></html>
